name: Actions Lock

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify actions lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Verify lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify --no-interactive
