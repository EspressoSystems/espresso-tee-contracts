name: Actions Lock

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify actions lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      # Download the release binary and check it against a pinned SHA-256 so a
      # replaced release asset can't run. To upgrade, update both values from
      # `gh release view <tag> -R github/gh-actions-lock --json assets`.
      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v0.4.1
          SHA256: 39deb2fe714dbf74b073d8245fc7f3d50cd0eee18d5c0900e9e849ae933ae17e
        run: |
          gh release download "$VERSION" -R github/gh-actions-lock -p linux-amd64 -O "$RUNNER_TEMP/gh-actions-lock"
          echo "$SHA256  $RUNNER_TEMP/gh-actions-lock" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/gh-actions-lock"

      - name: Verify lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/gh-actions-lock" --verify --no-interactive'
